<svg xmlns="http://www.w3.org/2000/svg" viewBox="140 155 1100 790" role="img" aria-labelledby="title desc">
  <title id="title">React TypeScript code typing animation</title>
  <desc id="desc">A transparent coding window in which portfolio source code is typed line by line.</desc>

  <style>
    .code-line {
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      animation: type-code 7.2s steps(18, end) infinite;
      animation-delay: calc(var(--line) * 72ms);
    }
    .line-number {
      fill: #ffffff;
      opacity: 0.22;
    }
    .plain { fill: #f7f4fa; }
    .keyword { fill: #d7b4eb; }
    .component { fill: #a9c8df; }
    .string { fill: #b9d9ce; }
    .function { fill: #e8bc9c; }
    .muted { fill: #9ea0aa; }
    .caret {
      animation: blink 0.62s steps(1, end) infinite;
    }
    @keyframes type-code {
      0%, 3% {
        opacity: 0;
        clip-path: inset(0 100% 0 0);
      }
      5% { opacity: 0.92; }
      14%, 74% {
        opacity: 0.92;
        clip-path: inset(0 0 0 0);
      }
      88%, 100% {
        opacity: 0;
        clip-path: inset(0 0 0 0);
      }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .code-line {
        animation: none;
        opacity: 0.9;
        clip-path: inset(0 0 0 0);
      }
      .caret { animation: none; }
    }
  </style>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15.5">
    <g class="line-number" text-anchor="end">
      <text x="160" y="180">01</text><text x="160" y="197">02</text><text x="160" y="214">03</text><text x="160" y="231">04</text><text x="160" y="248">05</text>
      <text x="160" y="265">06</text><text x="160" y="282">07</text><text x="160" y="299">08</text><text x="160" y="316">09</text><text x="160" y="333">10</text>
      <text x="160" y="350">11</text><text x="160" y="367">12</text><text x="160" y="384">13</text><text x="160" y="401">14</text><text x="160" y="418">15</text>
      <text x="160" y="435">16</text><text x="160" y="452">17</text><text x="160" y="469">18</text><text x="160" y="486">19</text><text x="160" y="503">20</text>
      <text x="160" y="520">21</text><text x="160" y="537">22</text><text x="160" y="554">23</text><text x="160" y="571">24</text><text x="160" y="588">25</text>
      <text x="160" y="605">26</text><text x="160" y="622">27</text><text x="160" y="639">28</text><text x="160" y="656">29</text><text x="160" y="673">30</text>
      <text x="160" y="690">31</text><text x="160" y="707">32</text><text x="160" y="724">33</text><text x="160" y="741">34</text><text x="160" y="758">35</text>
      <text x="160" y="775">36</text><text x="160" y="792">37</text><text x="160" y="809">38</text><text x="160" y="826">39</text><text x="160" y="843">40</text>
      <text x="160" y="860">41</text><text x="160" y="877">42</text><text x="160" y="894">43</text><text x="160" y="911">44</text><text x="160" y="928">45</text>
    </g>

    <g class="code-line" style="--line:0" transform="translate(0 180)"><text x="192"><tspan class="keyword">import</tspan><tspan class="plain"> { useLayoutEffect, useRef } </tspan><tspan class="keyword">from</tspan><tspan class="string"> "react"</tspan><tspan class="plain">;</tspan></text></g>
    <g class="code-line" style="--line:1" transform="translate(0 197)"><text x="192"><tspan class="keyword">import</tspan><tspan class="plain"> { gsap } </tspan><tspan class="keyword">from</tspan><tspan class="string"> "gsap"</tspan><tspan class="plain">;</tspan></text></g>
    <g class="code-line" style="--line:2" transform="translate(0 214)"><text x="192"><tspan class="keyword">import</tspan><tspan class="plain"> Profile </tspan><tspan class="keyword">from</tspan><tspan class="string"> "@/assets/images/me.png"</tspan><tspan class="plain">;</tspan></text></g>
    <g class="code-line" style="--line:3" transform="translate(0 231)"><text x="192"><tspan class="keyword">import</tspan><tspan class="plain"> Button </tspan><tspan class="keyword">from</tspan><tspan class="string"> "@/components/common/Button"</tspan><tspan class="plain">;</tspan></text></g>
    <g class="code-line" style="--line:4" transform="translate(0 248)"><text x="192" class="muted"> </text></g>
    <g class="code-line" style="--line:5" transform="translate(0 265)"><text x="192"><tspan class="keyword">const</tspan><tspan class="plain"> sections = [</tspan><tspan class="string">"home"</tspan><tspan class="plain">, </tspan><tspan class="string">"skills"</tspan><tspan class="plain">, </tspan><tspan class="string">"projects"</tspan><tspan class="plain">];</tspan></text></g>
    <g class="code-line" style="--line:6" transform="translate(0 282)"><text x="192" class="muted"> </text></g>
    <g class="code-line" style="--line:7" transform="translate(0 299)"><text x="192"><tspan class="keyword">const</tspan><tspan class="function"> Portfolio</tspan><tspan class="plain"> = () =&gt; {</tspan></text></g>
    <g class="code-line" style="--line:8" transform="translate(0 316)"><text x="224"><tspan class="keyword">const</tspan><tspan class="plain"> rootRef = </tspan><tspan class="function">useRef</tspan><tspan class="plain">&lt;</tspan><tspan class="component">HTMLDivElement</tspan><tspan class="plain">&gt;(</tspan><tspan class="keyword">null</tspan><tspan class="plain">);</tspan></text></g>
    <g class="code-line" style="--line:9" transform="translate(0 333)"><text x="224"><tspan class="keyword">const</tspan><tspan class="plain"> titleRef = </tspan><tspan class="function">useRef</tspan><tspan class="plain">&lt;</tspan><tspan class="component">HTMLHeadingElement</tspan><tspan class="plain">&gt;(</tspan><tspan class="keyword">null</tspan><tspan class="plain">);</tspan></text></g>
    <g class="code-line" style="--line:10" transform="translate(0 350)"><text x="192" class="muted"> </text></g>
    <g class="code-line" style="--line:11" transform="translate(0 367)"><text x="224"><tspan class="function">useLayoutEffect</tspan><tspan class="plain">(() =&gt; {</tspan></text></g>
