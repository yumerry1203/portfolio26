    <g class="code-line" style="--line:39" transform="translate(0 843)"><text x="320"><tspan class="component">&gt;</tspan><tspan class="plain">{section}</tspan><tspan class="component">&lt;/button&gt;</tspan></text></g>
    <g class="code-line" style="--line:40" transform="translate(0 860)"><text x="288" class="plain">))}</text></g>
    <g class="code-line" style="--line:41" transform="translate(0 877)"><text x="288"><tspan class="component">&lt;Button</tspan><tspan class="plain"> variant=</tspan><tspan class="string">"gradient"</tspan><tspan class="component">&gt;</tspan></text></g>
    <g class="code-line" style="--line:42" transform="translate(0 894)"><text x="320" class="plain">VIEW PROJECTS</text></g>
