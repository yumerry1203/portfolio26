    <g class="code-line" style="--line:17" transform="translate(0 469)"><text x="288"><tspan class="plain">gsap.</tspan><tspan class="function">fromTo</tspan><tspan class="plain">(title,</tspan></text></g>
    <g class="code-line" style="--line:18" transform="translate(0 486)"><text x="320"><tspan class="plain">{ y: </tspan><tspan class="component">28</tspan><tspan class="plain">, autoAlpha: </tspan><tspan class="component">0</tspan><tspan class="plain"> },</tspan></text></g>
    <g class="code-line" style="--line:19" transform="translate(0 503)"><text x="320"><tspan class="plain">{ y: </tspan><tspan class="component">0</tspan><tspan class="plain">, autoAlpha: </tspan><tspan class="component">1</tspan><tspan class="plain">, duration: </tspan><tspan class="component">0.6</tspan><tspan class="plain">,</tspan></text></g>
    <g class="code-line" style="--line:20" transform="translate(0 520)"><text x="352"><tspan class="plain">ease: </tspan><tspan class="string">"power3.out"</tspan><tspan class="plain"> }</tspan></text></g>
    <g class="code-line" style="--line:21" transform="translate(0 537)"><text x="288" class="plain">);</text></g>
    <g class="code-line" style="--line:22" transform="translate(0 554)"><text x="256"><tspan class="plain">}, root);</tspan></text></g>
    <g class="code-line" style="--line:23" transform="translate(0 571)"><text x="192" class="muted"> </text></g>
    <g class="code-line" style="--line:24" transform="translate(0 588)"><text x="256"><tspan class="keyword">return</tspan><tspan class="plain"> () =&gt; context.</tspan><tspan class="function">revert</tspan><tspan class="plain">();</tspan></text></g>
    <g class="code-line" style="--line:25" transform="translate(0 605)"><text x="224" class="plain">}, []);</text></g>
    <g class="code-line" style="--line:26" transform="translate(0 622)"><text x="192" class="muted"> </text></g>
    <g class="code-line" style="--line:27" transform="translate(0 639)"><text x="224"><tspan class="keyword">const</tspan><tspan class="function"> scrollTo</tspan><tspan class="plain"> = (id: </tspan><tspan class="component">string</tspan><tspan class="plain">) =&gt; {</tspan></text></g>
