    <g class="code-line" style="--line:35" transform="translate(0 775)"><text x="288"><tspan class="component">&lt;h1</tspan><tspan class="plain"> ref={titleRef}</tspan><tspan class="component">&gt;</tspan><tspan class="plain">PORTFOLIO</tspan><tspan class="component">&lt;/h1&gt;</tspan></text></g>
