<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aebfff"/>
      <stop offset="0.32" stop-color="#d4b4ef"/>
      <stop offset="0.68" stop-color="#f0add5"/>
      <stop offset="1" stop-color="#b4a8ef"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#718cff" stop-opacity="0.92"/>
      <stop offset="0.55" stop-color="#8298f4" stop-opacity="0.54"/>
      <stop offset="1" stop-color="#8298f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9fcf" stop-opacity="0.94"/>
      <stop offset="0.56" stop-color="#ef8bd9" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#ef8bd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow" cx="50%" cy="50%" r="50%">
