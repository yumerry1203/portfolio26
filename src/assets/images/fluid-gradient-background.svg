<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9c9ff"/>
      <stop offset="0.38" stop-color="#d9b8f1"/>
      <stop offset="0.72" stop-color="#f0b4dc"/>
      <stop offset="1" stop-color="#a7b9ff"/>
      <animate attributeName="x1" values="0;0.22;0" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="1;0.76;1" dur="22s" repeatCount="indefinite"/>
    </linearGradient>

    <radialGradient id="pink" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9fd5" stop-opacity="0.98"/>
      <stop offset="0.48" stop-color="#ef8bd9" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#ef8bd9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9f45e8" stop-opacity="0.95"/>
      <stop offset="0.52" stop-color="#b05bea" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#b05bea" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coral" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd0c7" stop-opacity="0.98"/>
      <stop offset="0.45" stop-color="#f8b2c7" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#f8b2c7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blue" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#718cff" stop-opacity="0.9"/>
      <stop offset="0.52" stop-color="#708cf5" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#708cf5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff1e8" stop-opacity="0.9"/>
      <stop offset="0.42" stop-color="#ffe5ef" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <filter id="water" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0028 0.0045" numOctaves="2" seed="8" result="noise">
        <animate attributeName="baseFrequency" values="0.0028 0.0045;0.0042 0.0026;0.0028 0.0045" dur="24s" repeatCount="indefinite"/>
        <animate attributeName="seed" values="8;14;8" dur="36s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="92" xChannelSelector="R" yChannelSelector="B">
        <animate attributeName="scale" values="68;108;76;68" dur="20s" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feGaussianBlur stdDeviation="78"/>
    </filter>

    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <g filter="url(#water)">
    <ellipse cx="410" cy="260" rx="620" ry="470" fill="url(#blue)">
      <animate attributeName="cx" values="410;650;350;410" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;420;210;260" dur="19s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;1.12;0.94;1" dur="17s" repeatCount="indefinite" additive="sum"/>
    </ellipse>

    <ellipse cx="920" cy="190" rx="620" ry="430" fill="url(#pink)">
      <animate attributeName="cx" values="920;1120;760;920" dur="27s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;360;130;190" dur="21s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" values="0 920 190;12 920 190;-8 920 190;0 920 190" dur="26s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1500" cy="520" rx="650" ry="600" fill="url(#violet)">
      <animate attributeName="cx" values="1500;1320;1620;1500" dur="22s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="520;320;660;520" dur="25s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1;0.9;1.14;1" dur="20s" repeatCount="indefinite" additive="sum"/>
    </ellipse>

    <ellipse cx="760" cy="850" rx="760" ry="470" fill="url(#coral)">
      <animate attributeName="cx" values="760;1040;620;760" dur="29s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="850;710;920;850" dur="24s" repeatCount="indefinite"/>
    </ellipse>

    <ellipse cx="1030" cy="520" rx="430" ry="520" fill="url(#light)">
      <animate attributeName="cx" values="1030;870;1180;1030" dur="18s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="520;650;390;520" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="rx" values="430;560;390;430" dur="16s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g filter="url(#soften)" opacity="0.44">
    <path d="M-120 760C260 520 430 950 790 730C1130 520 1260 860 1580 650C1740 545 1880 500 2050 540" fill="none" stroke="#f8ddff" stroke-width="115" stroke-linecap="round">
      <animate attributeName="d" values="M-120 760C260 520 430 950 790 730C1130 520 1260 860 1580 650C1740 545 1880 500 2050 540;M-120 650C210 880 510 520 820 760C1090 970 1400 500 1650 720C1800 850 1920 680 2050 630;M-120 760C260 520 430 950 790 730C1130 520 1260 860 1580 650C1740 545 1880 500 2050 540" dur="22s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
